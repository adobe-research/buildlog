[project]
name = "buildlog-cpp"
version = "0.1.0"
description = "C-family plugin for buildlog: toolchains, native linking, C++, clang probes"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["buildlog"]

[project.entry-points."buildlog.plugins"]
buildlog-cpp = "buildlog_cpp:manifest_dir"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
buildlog = { workspace = true }
