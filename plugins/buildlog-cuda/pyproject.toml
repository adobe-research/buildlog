[project]
name = "buildlog-cuda"
version = "0.1.0"
description = "NVIDIA CUDA plugin for buildlog: toolkit discovery, nvcc, architectures, device link (provisional)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["buildlog", "buildlog-cpp"]

[project.entry-points."buildlog.plugins"]
buildlog-cuda = "buildlog_cuda:manifest_dir"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
buildlog = { workspace = true }
buildlog-cpp = { workspace = true }
