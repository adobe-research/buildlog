# Relations `buildlog why` hides by default (docs/proof-protocol.md, "Structural
# leaves"): counts that only check the layers' own registries, and the cores the
# cycle checks restrict their reachability to (a filter that never rejects a
# node of a cycle: the cause is the cycle's edges). Ground facts stated in the
# core layers are hidden without being listed.
structural = ["nkeys", "action_core", "dep_core"]

# Relations that record why a target is built in a configuration
# (docs/proof-protocol.md, "Existence and attributes"): beneath an action's
# attribute they say why the action exists, not why it has the attribute.
demand = ["needed"]

# Configuration construction (L1_targets.dl), shaped by `why` unless --full
# (docs/proof-protocol.md, "Shaping"): a row of a `fold` relation is one
# line without its subproof (`fold_origins`: with the spec and user facts
# under it, for a proof about one declaration); an `elide` row (true of
# every configuration by its name) is dropped; a `flatten` row's recursion
# over a settings list is spliced into one node.
fold = [
  "decl_value",
  "decl_suffix",
  "config",
  "mconfig",
  "config_slice",
  "config_setting",
  "exec_config",
]
fold_origins = ["decl_cfg"]
elide = [
  # a library not built both ways in this configuration: its edges go to the
  # library itself (L3's linkage twins), not a reason a proof should show
  "library_both",
  "linkage_split",
  "decl_has",
  "config_platform",
  "settings_suffix",
  "cfg_suffix",
  "settings_name",
  "cfg_name",
  "cond_sub",
  # the path helpers (V_vocabulary.dl): functions of the path, computed
  "path_slash",
  "path_last_slash",
  "path_basename",
  "path_dirname",
  "path_dot",
  "path_stem",
  "path_ext",
]
flatten = ["exec_settings"]

