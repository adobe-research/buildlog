# Which platforms a prebuilt file of a needed import covers (L3_native.dl,
# buildlog.objfile): its object headers, read in-process, cached by stat.
[[probe]]
kind = "file_archs"
request = "req_file_archs"
domain = "domain_file_archs"
result = ["res_file_format", "res_file_arch"]
entry = "buildlog.objfile:file_archs"
fingerprint = "buildlog.objfile:file_fingerprint"

[[probe]]
kind = "metadata_path"
request = "req_metadata_path"
domain = "domain_metadata_path"
result = ["res_metadata_path"]
entry = "buildlog.providers:metadata_path"
fingerprint = "buildlog.providers:metadata_path_fingerprint"
