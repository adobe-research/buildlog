# The buildlog core: L0 (actions), L1 (targets, platforms, configurations,
# conditions, property propagation), L2 (toolchains and their selection) and
# L3 (native code: objects, archives, shared libraries, executables, link
# order, fat artifacts, imported artifacts) and package discovery (which
# names are wanted, where to look, selection and the relay of provider
# results; the formats are plugins' providers). Language- and format-neutral. It is the root
# package (rank 0) and is qualified like every other package: only the names
# listed below are visible to higher layers.
name = "buildlog"
version = "0.1.0"
rank = 0
layers = [
  "types.dl",
  "L0_actions.dl",
  "L1_targets.dl",
  "L1_configure_file.dl",
  "L2_toolchains.dl",
  "L3_native.dl",
  "L3_discovery.dl",
  "L1_options.dl",
  "L3_install.dl",
  "V_vocabulary.dl",
  "V_generators.dl",
]

