# FLATBUFFERS_BUILD_TESTS (on by default): flattests with the headers flatc
# generates for it, and the three samples. add_test(NAME flattests COMMAND
# flattests) is the one test.
request_all = [
  ["flattests"],
  ["flatsamplebinary"],
  ["flatsampletext"],
  ["flatsamplebfbs"],
]
test = [["flattests", "flattests"]]

# compile_schema_for_test(<schema> <opts>) and compile_schema_for_test_fbsh,
# in CMakeLists.txt's order: (target, dir, schema name, suffix, options).
generate = [
  ["flatc_cpp_test", "tests", "alignment_test", "_generated", "FLATC_OPT_COMP"],
  ["flatc_cpp_test", "tests", "default_vectors_strings_test", ".fbs", "FLATC_OPT_COMP"],
  ["flatc_cpp_test", "tests", "arrays_test", "_generated", "FLATC_OPT_SCOPED_ENUMS"],
  ["flatc_cpp_test", "tests", "native_inline_table_test", "_generated", "FLATC_OPT_COMP"],
  ["flatc_cpp_test", "tests", "native_type_test", "_generated", "FLATC_OPT_COMP"],
  ["flatc_cpp_test", "tests/key_field", "key_field_sample", "_generated", "FLATC_OPT_COMP"],
  ["flatc_cpp_test", "tests/64bit/evolution", "v1", "_generated", "FLATC_OPT_COMP"],
  ["flatc_cpp_test", "tests/64bit/evolution", "v2", "_generated", "FLATC_OPT_COMP"],
  [
    "flatc_cpp_test",
    "tests",
    "union_underlying_type_test",
    "_generated",
    "FLATC_OPT_SCOPED_ENUMS"
  ],
  # The sample's header (not in CMake's build: its compile_schema_for_samples
  # is never called; the flags are scripts/generate_code.py's, which wrote
  # the checked-in samples/monster_generated.h).
  ["flatc_cpp_sample", "samples", "monster"],
]

# CMakeLists.txt's compile_schema (and compile_schema_for_test/_fbsh): flatc
# writes <dir>/<name><suffix>.h below the target's generated directory
# (CMake's binary dir). The command names flatc by target reference: core
# builds it in the exec configuration.
[generator.flatc_cpp_test]
params = ["dir", "name", "suffix", "opts"]
owner = "flattests"
label = "FLATC"
run = [
  "flatc",
  "${list:{opts}}",
  "--filename-suffix",
  "{suffix}",
  "-o",
  "${gen:{dir}}",
  "${src:{dir}/{name}.fbs}"
]
output = ["{dir}/{name}{suffix}.h"]

[generator.flatc_cpp_sample]
params = ["dir", "name"]
owner = "flatsample"
label = "FLATC"
run = [
  "flatc",
  "${list:SAMPLE_CPP_OPTS}",
  "--filename-suffix",
  "_generated",
  "-o",
  "${gen:{dir}}",
  "${src:{dir}/{name}.fbs}"
]
output = ["{dir}/{name}_generated.h"]

# --bfbs-gen-embed also writes the binary schema as a header.
[generator.test_64bit]
owner = "flattests"
label = "FLATC"
run = [
  "flatc",
  "${list:FLATC_OPT_COMP_BFBS_EMBED}",
  "--filename-suffix",
  "_generated",
  "-o",
  "${gen:tests/64bit}",
  "${src:tests/64bit/test_64bit.fbs}"
]
output = ["tests/64bit/test_64bit_generated.h", "tests/64bit/test_64bit_bfbs_generated.h"]

[srclist.FlatBuffers_Tests_SRCS]
srclist_splice = ["FlatBuffers_Library_SRCS"]
srclist_source = [
  "src/idl_gen_fbs.cpp",
  "tests/default_vectors_strings_test.cpp",
  "tests/evolution_test.cpp",
  "tests/flexbuffers_test.cpp",
  "tests/fuzz_test.cpp",
  "tests/json_test.cpp",
  "tests/key_field_test.cpp",
  "tests/monster_test.cpp",
  "tests/optional_scalars_test.cpp",
  "tests/parser_test.cpp",
  "tests/proto_test.cpp",
  "tests/reflection_test.cpp",
  "tests/test.cpp",
  "tests/test_assert.cpp",
  "tests/test_builder.cpp",
  "tests/util_test.cpp",
  "tests/vector_table_naked_ptr_test.cpp",
  "tests/native_type_test_impl.cpp",
  "tests/alignment_test.cpp",
  "tests/64bit/offset64_test.cpp",
  "src/code_generators.cpp",
]

[srclist.FlatBuffers_Sample_Binary_SRCS]
srclist_source = ["samples/sample_binary.cpp"]

[srclist.FlatBuffers_Sample_Text_SRCS]
srclist_splice = ["FlatBuffers_Library_SRCS"]
srclist_source = ["samples/sample_text.cpp"]

[srclist.FlatBuffers_Sample_BFBS_SRCS]
srclist_splice = ["FlatBuffers_Library_SRCS"]
srclist_source = ["samples/sample_bfbs.cpp"]

[target.flattests]
kind = "executable"
profile = "dir_props"
srclist_use = ["FlatBuffers_Tests_SRCS"]
deps = { private = ["ProjectConfig"] }
gen_include = { private = ["", "tests"] }
# The source-side include dirs of target_include_directories(flattests
# PUBLIC ...); the binary-side ones are gen_include. "Have tests
# load data from the source directory": the test data path.
private = { "cc.include_dir" = ["src:", "src:src", "src:tests"], "cc.define" = "FLATBUFFERS_TEST_PATH_PREFIX=${FLATBUFFERS_SRC}/" }

# add_library(flatsample INTERFACE): what the samples share, the generated
# monster_generated.h.
[target.flatsample]
gen_include = { interface = ["samples"] }

[target.flatsamplebinary]
kind = "executable"
profile = "dir_props"
srclist_use = ["FlatBuffers_Sample_Binary_SRCS"]
deps = { private = ["ProjectConfig", "flatsample"] }

[target.flatsampletext]
kind = "executable"
profile = "dir_props"
srclist_use = ["FlatBuffers_Sample_Text_SRCS"]
deps = { private = ["ProjectConfig", "flatsample"] }

[target.flatsamplebfbs]
kind = "executable"
profile = "dir_props"
srclist_use = ["FlatBuffers_Sample_BFBS_SRCS"]
deps = { private = ["ProjectConfig", "flatsample"] }

[word_list]
FLATC_OPT_COMP = ["--cpp", "--gen-compare", "--gen-mutable", "--gen-object-api", "--reflect-names"]
FLATC_OPT_SCOPED_ENUMS = [
  "--cpp",
  "--gen-compare",
  "--gen-mutable",
  "--gen-object-api",
  "--reflect-names",
  "--scoped-enums",
]
# "${FLATC_OPT_COMP};--bfbs-gen-embed"
FLATC_OPT_COMP_BFBS_EMBED = [
  "--cpp",
  "--gen-compare",
  "--gen-mutable",
  "--gen-object-api",
  "--reflect-names",
  "--bfbs-gen-embed",
]
# generate_code.py: BASE_OPTS + CPP_OPTS for samples/monster.fbs.
SAMPLE_CPP_OPTS = [
  "--reflect-names",
  "--gen-mutable",
  "--gen-object-api",
  "--cpp",
  "--gen-compare",
  "--gen-absl-hash",
]
