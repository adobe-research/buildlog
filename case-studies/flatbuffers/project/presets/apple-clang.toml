# User decisions for this Mac: Apple's clang (the /usr/bin/c++ CMake picks)
# compiles and links everything, per (language, exec platform, target
# platform). Everything runs on arm64-macos; the products target it or
# x86_64-macos (the x86_64 configuration and universal2's second slice).
# Nothing here says which toolchain builds flatc: a tool the build runs is
# built for arm64-macos, and only the first rows can build for it.
toolchain_pin = [
  ["cxx", "arm64-macos", "arm64-macos", "apple-clang"],
  ["native-link", "arm64-macos", "arm64-macos", "apple-clang"],
  ["cxx", "arm64-macos", "x86_64-macos", "apple-clang"],
  ["native-link", "arm64-macos", "x86_64-macos", "apple-clang"],
]
