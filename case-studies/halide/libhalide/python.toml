[python_requires.pybind11]
module = "pybind11"
spec = ">=2.6"

[pybind11_module.Halide_Python]

[pybind11_module.Halide_PythonRuntime]

[target.Halide_Python]
sources = [
  "python_bindings/halide/src/halide_/PyArgument.cpp",
  "python_bindings/halide/src/halide_/PyBoundaryConditions.cpp",
  "python_bindings/halide/src/halide_/PyBuffer.cpp",
  "python_bindings/halide/src/halide_/PyCallable.cpp",
  "python_bindings/halide/src/halide_/PyConciseCasts.cpp",
  "python_bindings/halide/src/halide_/PyDerivative.cpp",
  "python_bindings/halide/src/halide_/PyEnums.cpp",
  "python_bindings/halide/src/halide_/PyError.cpp",
  "python_bindings/halide/src/halide_/PyExpr.cpp",
  "python_bindings/halide/src/halide_/PyExternFuncArgument.cpp",
  "python_bindings/halide/src/halide_/PyFunc.cpp",
  "python_bindings/halide/src/halide_/PyFuncRef.cpp",
  "python_bindings/halide/src/halide_/PyGenerator.cpp",
  "python_bindings/halide/src/halide_/PyHalide.cpp",
  "python_bindings/halide/src/halide_/PyImageParam.cpp",
  "python_bindings/halide/src/halide_/PyInlineReductions.cpp",
  "python_bindings/halide/src/halide_/PyIROperator.cpp",
  "python_bindings/halide/src/halide_/PyLambda.cpp",
  "python_bindings/halide/src/halide_/PyLoopLevel.cpp",
  "python_bindings/halide/src/halide_/PyModule.cpp",
  "python_bindings/halide/src/halide_/PyParam.cpp",
  "python_bindings/halide/src/halide_/PyParameter.cpp",
  "python_bindings/halide/src/halide_/PyPipeline.cpp",
  "python_bindings/halide/src/halide_/PyRDom.cpp",
  "python_bindings/halide/src/halide_/PySerialization.cpp",
  "python_bindings/halide/src/halide_/PyStage.cpp",
  "python_bindings/halide/src/halide_/PyTarget.cpp",
  "python_bindings/halide/src/halide_/PyTuple.cpp",
  "python_bindings/halide/src/halide_/PyType.cpp",
  "python_bindings/halide/src/halide_/PyVar.cpp",
  "python_bindings/halide/src/halide_/PyVarOrRVar.cpp",
]
python_extension = [["halide", "halide_"]]
deps = { private = ["Halide"] }

[target.Halide_PythonRuntime]
sources = [
  "python_bindings/halide-runtime/src/halide/runtime/PyRuntime.cpp",
  "python_bindings/halide-runtime/src/halide/runtime/PyRuntimeBuffer.cpp",
  "src/Float16.cpp",
]
python_extension = [["halide/runtime", "_runtime"]]
deps = { private = ["Halide_Runtime"] }
private = { "cc.include_dir" = "src:src" }
