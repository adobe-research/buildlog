# Halide's build policy over LLVM (M3 phase 1): the Halide-specific part of
# what FindHalide_LLVM.cmake does, as checks and a small rule over the
# package-level facts the tier-2 LLVM, Clang and LLD packages state
# (package_version, package_attr) and their LLVM:<component> targets
# (llvm-install/). No discovery here. [M3 phase 2] halide_build_gen.dl: the sources Halide's host
# tools generate (binary2cpp, build_halide_h), with no exec annotation.
# [M3 phase 3] halide_build_runtime.dl: the runtime (clang -> llvm-as ->
# binary2cpp), compiled into libHalide. [M3 phase 5] halide_build_gen.dl:
# flatc's halide_ir.fbs.h. [M3 phase 4] halide_build_generator.dl: generator
# libraries (add_halide_library) and runtimes (add_halide_runtime). [M3
# phase 6] the rest of add_halide_library that test/ uses, and
# add_halide_stub. halide_build_test.dl: add_halide_test over core's typed
# tests (`buildlog test`).
name = "halide-build"
version = "0.1.0"
rank = 4
namespace = "halide_build"
layers = [
  "halide_build.dl",
  "halide_build_gen.dl",
  "halide_build_runtime.dl",
  "halide_build_generator.dl",
  "halide_build_install.dl",
  "halide_build_test.dl"
]
requires = { buildlog-cpp = ">=0.1" }
