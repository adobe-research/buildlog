# CMake's install: install(TARGETS zlib zlibstatic ...) and the ZLIB package
# (ZLIBConfig.cmake, ZLIB::ZLIB; zlib.pc is its own configured file). One
# component, ZLIB, is the library in the configuration's linkage: libz.dylib
# and its links in release, libz.a in release-static. The compatibility claim
# is derived from native_version (soversion 1 = the major: same_major);
# upstream's AnyNewerVersion is looser, so it is not stated.
[export.ZLIB]
version = "1.3.2"
description = "zlib compression library"
component = { ZLIB = "zlib" }
format_omit = { pc = "zlib installs its own zlib.pc (zlib.pc.cmakein)" }

# zlib.h from the source tree; zconf.h is configured per configuration, and
# installs from the configuration's own generated directory.
[target.zlib]
install_map = [["src:", "includedir", ""]]
install_file = ["src:zlib.h"]
install_configured = { "zconf.h" = "includedir" }
