# Meson cross file for the x86_64 build on this arm64 Mac (run-meson.sh's
# cross variant): the same Apple clang with -arch x86_64. Meson's native
# machine (the gen.tab programs, `native: true`) stays the default arm64 cc.
[binaries]
c = ['cc', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
