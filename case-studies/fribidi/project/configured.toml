# The configured headers: config.h (meson.build's configuration_data cdata,
# which Meson writes without a template) and fribidi-config.h
# (lib/meson.build, from lib/fribidi-config.h.in). One owner, `config`, has
# both: its members are the targets meson.build compiles with
# -DHAVE_CONFIG_H, and every member has all of the owner's variables (core's
# rule; rules.dl's owner_* rows give them to each member). The generators
# are not members: they skip both files (gen.toml's native set).
configure_file = [["config", "config.h"], ["config", "fribidi-config.h"]]
configure_file_at_only = [["config", "config.h"], ["config", "fribidi-config.h"]]
cc_configured_header = [["config", "config.h"], ["config", "fribidi-config.h"]]
owner_member = [
  ["config", "libfribidi"],
  ["config", "fribidi"],
  ["config", "fribidi-benchmark"],
  ["config", "fribidi-bidi-types"],
  ["config", "fribidi-caprtl2utf8"],
  ["config", "BidiTest"],
  ["config", "BidiCharacterTest"],
]

# config.h. Meson writes one `#define NAME value` (or `#undef NAME`) per
# entry, sorted by name, each followed by a blank line; the template states
# that layout. cdata.set(NAME, bool) is `#cmakedefine NAME`, cdata.set10 is
# `#define NAME @NAME@` (1 or 0), cdata.set(NAME, 1) `#cmakedefine NAME 1`.
configure_file_text = [
  ["config", "config.h", 0, "/*"],
  [
    "config",
    "config.h",
    1,
    " * config.h, generated by buildlog from fribidi's configure checks and"
  ],
  [
    "config",
    "config.h",
    2,
    " * options (meson.build's configuration_data, which Meson writes without a"
  ],
  ["config", "config.h", 3, " * template)."],
  ["config", "config.h", 4, " */"],
  ["config", "config.h", 5, ""],
  ["config", "config.h", 6, "#pragma once"],
  ["config", "config.h", 7, ""],
  ["config", "config.h", 10, "#cmakedefine DEBUG 1"],
  ["config", "config.h", 11, ""],
  ["config", "config.h", 12, "#cmakedefine FRIBIDI_NO_DEPRECATED"],
  ["config", "config.h", 13, ""],
  ["config", "config.h", 14, "#cmakedefine HAVE_MEMMOVE"],
  ["config", "config.h", 15, ""],
  ["config", "config.h", 16, "#define HAVE_MEMORY_H @HAVE_MEMORY_H@"],
  ["config", "config.h", 17, ""],
  ["config", "config.h", 18, "#cmakedefine HAVE_MEMSET"],
  ["config", "config.h", 19, ""],
  ["config", "config.h", 20, "#define HAVE_STDLIB_H @HAVE_STDLIB_H@"],
  ["config", "config.h", 21, ""],
  ["config", "config.h", 22, "#cmakedefine HAVE_STRDUP"],
  ["config", "config.h", 23, ""],
  ["config", "config.h", 24, "#define HAVE_STRINGIZE @HAVE_STRINGIZE@"],
  ["config", "config.h", 25, ""],
  ["config", "config.h", 26, "#cmakedefine HAVE_STRINGS_H"],
  ["config", "config.h", 27, ""],
  ["config", "config.h", 28, "#define HAVE_STRING_H @HAVE_STRING_H@"],
  ["config", "config.h", 29, ""],
  ["config", "config.h", 30, "#cmakedefine HAVE_SYS_TIMES_H"],
  ["config", "config.h", 31, ""],
  ["config", "config.h", 32, "#cmakedefine STDC_HEADERS 1"],
  ["config", "config.h", 33, ""],
]
# fribidi-config.h: lib/fribidi-config.h.in, whole.
configure_file_lines = [["config", "fribidi-config.h", 0, "lib/fribidi-config.h.in", 1, 0]]

# The values. Checks: rules.dl's owner_check_* (defined or not, 1 or 0, a
# size). Options and settings: conditions (spec.toml). The version
# variables and the MSVC placeholder are derived in rules.dl.
owner_check_define = [
  ["config", "HAVE_MEMMOVE", "HAVE_MEMMOVE"],
  ["config", "HAVE_MEMSET", "HAVE_MEMSET"],
  ["config", "HAVE_STRDUP", "HAVE_STRDUP"],
  ["config", "HAVE_STRINGS_H", "HAVE_STRINGS_H"],
  ["config", "HAVE_SYS_TIMES_H", "HAVE_SYS_TIMES_H"],
]
owner_check_10 = [
  ["config", "HAVE_STDLIB_H", "HAVE_STDLIB_H"],
  ["config", "HAVE_STRING_H", "HAVE_STRING_H"],
  ["config", "HAVE_MEMORY_H", "HAVE_MEMORY_H"],
]
owner_check_size = [["config", "SIZEOF_INT", "c", "int"]]
owner_define = [
  ["config", "HAVE_STRINGIZE", "1"],
  ["config", "configure_input", "fribidi-config.h file generated by buildlog"],
  ["config", "PACKAGE", "fribidi"],
  ["config", "PACKAGE_NAME", "GNU FriBidi"],
  ["config", "PACKAGE_BUGREPORT", "https://github.com/fribidi/fribidi/issues/new"],
]
owner_define_when = [
  ["config", "STDC_HEADERS", "1", "cc.check.HAVE_STRINGS_H == yes"],
  ["config", "FRIBIDI_NO_DEPRECATED", "1", "!deprecated"],
  ["config", "DEBUG", "1", "native.opt == debug"],
]
owner_undefine_when = [
  ["config", "STDC_HEADERS", "cc.check.HAVE_STRINGS_H == no"],
  ["config", "FRIBIDI_NO_DEPRECATED", "deprecated"],
  ["config", "DEBUG", "native.opt != debug"],
]
