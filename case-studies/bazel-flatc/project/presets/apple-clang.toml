# User decisions for this Mac: Apple clang compiles and links everything.
# The tools run on arm64-macos; the products target it or x86_64-macos.
# Nothing here says which targets are tools: flatc is built for the exec
# configuration because an action runs it (rules.dl's fbs_cc_library).
toolchain_pin = [
  ["cxx", "arm64-macos", "arm64-macos", "apple-clang"],
  ["native-link", "arm64-macos", "arm64-macos", "apple-clang"],
  ["cxx", "arm64-macos", "x86_64-macos", "apple-clang"],
  ["native-link", "arm64-macos", "x86_64-macos", "apple-clang"],
]
