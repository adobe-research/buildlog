# Where SPIRV-Headers is installed: a prefix given on the command line,
# -D SPIRV_HEADERS_PREFIX=/abs/prefix (its share/cmake/SPIRV-Headers/ holds
# the CMake export the cmake provider imports).
package_prefix = [["${SPIRV_HEADERS_PREFIX}"]]
