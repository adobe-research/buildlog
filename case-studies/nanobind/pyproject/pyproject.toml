# nanobind_example's pyproject.toml (03bd872) as an author adopting buildlog
# would write it (README, "pyproject.toml as the entry point" and
# "Wheels"): the build backend is buildlog-python's PEP 517 shim, and the
# buildlog project entry point is the [tool.buildlog] table (the same keys
# as ../project/buildlog.toml) instead of a buildlog.toml.
# [tool.scikit-build] is gone: its wheel.py-api is spec.toml's
# python_py_api. The other tables are upstream's (in tombi's table
# order). Configure it like ../project:
#   uv run --frozen buildlog configure --package-path case-studies/nanobind \
#     --user case-studies/nanobind/project/presets/apple-clang-arm64.toml \
#     --user case-studies/nanobind/project/presets/interpreters.toml -C BUILD case-studies/nanobind/pyproject
# or build a wheel through a PEP 517 frontend (../pep517/run-pep517.sh).

[project]
name = "nanobind-example"
version = "0.0.1"
description = "An example minimal project that compiles bindings using nanobind and scikit-build"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Wenzel Jakob", email = "wenzel.jakob@epfl.ch" },
]
classifiers = [
  "License :: OSI Approved :: BSD License",
]

[project.urls]
Homepage = "https://github.com/wjakob/nanobind_example"

[build-system]
requires = ["buildlog-python", "nanobind >=1.3.2"]
build-backend = "buildlog_python.backend"

[tool.buildlog]
uses = ["buildlog-cpp", "buildlog-python", "nanobind"]
source_root = "${NANOBIND_EXAMPLE_SRC}"
spec = ["../project/spec.toml"]

[tool.buildlog.vars]
NANOBIND_EXAMPLE_SRC = "${REPO_ROOT}/case-studies/nanobind/upstream"
NANOBIND_VENVS = "${REPO_ROOT}/build/case-nanobind"

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Run pytest to ensure that the package was correctly built
test-command = "pytest {project}/tests"
test-requires = "pytest"

# Don't test Python 3.8 wheels on macOS/arm64
test-skip = "cp38-macosx_*:arm64"

# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"
