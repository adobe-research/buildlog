[project]
name = "buildlog-python"
version = "0.1.0"
description = "Python interpreter discovery and extension-module conventions for buildlog (nanobind case study)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["buildlog", "buildlog-cpp", "packaging>=24"]

[project.entry-points."buildlog.plugins"]
buildlog-python = "buildlog_python:manifest_dir"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
buildlog = { workspace = true }
buildlog-cpp = { workspace = true }
